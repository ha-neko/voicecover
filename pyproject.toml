[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voicecover"
version = "0.1.0"
description = "Translate and dub videos into another language"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
  "deep-translator>=1.11,<2",
  "edge-tts>=7.3.1,<8",
  "fastapi>=0.115,<1",
  "faster-whisper>=1.1,<2",
  "python-multipart>=0.0.18,<1",
  "sentencepiece>=0.2,<0.3",
  "sacremoses>=0.1,<0.2",
  "subword-nmt>=0.3,<0.4",
  "textual>=1.0,<2",
  "uvicorn>=0.34,<1",
  "yt-dlp>=2025.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2"]
visual = ["rapidocr>=3,<4", "onnxruntime>=1.24,<2", "numpy>=1.26,<3", "opencv-python-headless>=4.9,<6", "Pillow>=10,<13", "python-bidi>=0.6,<1"]
clone = ["f5-tts>=1.1.22,<2", "huggingface_hub>=0.23,<2", "soundfile>=0.12,<0.15"]

[project.scripts]
voicecover = "voicecover.cli:main"
voicecover-tui = "voicecover.tui:main"
voicecover-web = "voicecover.web:main"
voicecover-models = "voicecover.argos:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voicecover = ["*.tcss", "web_assets/*.html", "web_assets/*.css", "web_assets/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
